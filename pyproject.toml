[project]
name = "crew_stock_ai_agent"
version = "0.1.0"
description = "crew_stock_ai_agent using crewAI"
authors = [{ name = "Ivan Klymchuk", email = "klymhuk.ivan@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.130.0,<1.0.0",
    "pydantic>=2.11.7",
]

[project.scripts]
my_stock_picker = "crew_stock_ai_agent.main:run"
run_crew = "crew_stock_ai_agent.main:run"
train = "crew_stock_ai_agent.main:train"
replay = "crew_stock_ai_agent.main:replay"
test = "crew_stock_ai_agent.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
